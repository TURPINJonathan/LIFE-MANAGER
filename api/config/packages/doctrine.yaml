doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Security:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Security/Domain/Entity'
                prefix: 'App\Module\Security\Domain\Entity'
                alias: Security
            Category:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Category/Domain/Entity'
                prefix: 'App\Module\Category\Domain\Entity'
                alias: Category
            Merchant:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Merchant/Domain/Entity'
                prefix: 'App\Module\Merchant\Domain\Entity'
                alias: Merchant
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Account/Domain/Entity'
                prefix: 'App\Module\Account\Domain\Entity'
                alias: Account

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
