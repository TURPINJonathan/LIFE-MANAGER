name: life-manager

services:
  php:
    build: .
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: postgresql://lm:lm@database:5432/life_manager?serverVersion=16&charset=utf8
      DATABASE_TEST_URL: postgresql://lm:lm@database:5432/life_manager_test?serverVersion=16&charset=utf8
    volumes:
      - ./:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int)!@fsockopen('127.0.0.1', 9000));"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - lm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9100:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - lm

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lm
      POSTGRES_PASSWORD: lm
      POSTGRES_DB: life_manager
    ports:
      - "9432:5432"
    volumes:
      - lm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lm -d life_manager"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - lm

volumes:
  lm_postgres:

networks:
  lm:
