; OPcache désactivé : PHP 8.5.11 segfault pendant la compilation
; du container Symfony en debug (CLI cache:warmup / 1er hit FPM).
; Réactiver quand une version PHP corrigée est dispo.
opcache.enable=0
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
